<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DottBertoliniPT - Reset Password</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1E88E5, #1565C0);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }
        h2 { color: #1565C0; margin-bottom: 10px; }
        p { color: #666; margin-bottom: 25px; font-size: 14px; }
        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }
        input:focus { border-color: #1E88E5; }
        button {
            width: 100%;
            padding: 14px;
            background: #1E88E5;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover { background: #1565C0; }
        button:disabled { background: #90CAF9; cursor: not-allowed; }
        .message { margin-top: 15px; font-size: 14px; font-weight: bold; }
        .success { color: #2E7D32; }
        .error { color: #C62828; }
        .back-link { margin-top: 20px; font-size: 14px; }
        .back-link a { color: #1E88E5; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🔒 Reset Password</h2>
        <p>Inserisci la tua nuova password</p>
        <input type="password" id="password" placeholder="Nuova password">
        <input type="password" id="confirm" placeholder="Conferma nuova password">
        <button id="submitBtn" onclick="resetPassword()">AGGIORNA PASSWORD</button>
        <div class="message" id="message"></div>
        <div class="back-link">
            <a href="/login">Torna al Login</a>
        </div>
    </div>

    <script>
        // Scambia il codice con un token usando l'API Supabase
        async function getTokenFromCode(code) {
            try {
                var response = await fetch('https://npfvjroihkaxsuvwkrhm.supabase.co/auth/v1/verify', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'apikey': 'sb_publishable_YPLX3obafUHP8DPjKT9mug_f37TYfil'
                    },
                    body: JSON.stringify({
                        type: 'recovery',
                        token: code
                    })
                });
                
                if (response.ok) {
                    var data = await response.json();
                    return data.access_token;
                }
                return null;
            } catch (e) {
                return null;
            }
        }

        async function resetPassword() {
            var password = document.getElementById('password').value;
            var confirm = document.getElementById('confirm').value;
            var message = document.getElementById('message');
            var btn = document.getElementById('submitBtn');

            if (!password || !confirm) {
                message.className = 'message error';
                message.textContent = 'Compila entrambi i campi';
                return;
            }
            if (password.length < 6) {
                message.className = 'message error';
                message.textContent = 'La password deve avere almeno 6 caratteri';
                return;
            }
            if (password !== confirm) {
                message.className = 'message error';
                message.textContent = 'Le password non coincidono';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Verifica in corso...';
            message.className = 'message';
            message.textContent = '';

            // Leggi il codice dall'URL
            var qs = new URLSearchParams(window.location.search);
            var code = qs.get('code');

            if (!code) {
                message.className = 'message error';
                message.textContent = 'Codice non trovato. Richiedi un nuovo reset.';
                btn.disabled = false;
                btn.textContent = 'AGGIORNA PASSWORD';
                return;
            }

            // Scambia il codice con un token
            var token = await getTokenFromCode(code);

            if (!token) {
                message.className = 'message error';
                message.textContent = 'Link scaduto o non valido. Richiedi un nuovo reset.';
                btn.disabled = false;
                btn.textContent = 'AGGIORNA PASSWORD';
                return;
            }

            btn.textContent = 'Aggiornamento...';

            try {
                var response = await fetch('https://npfvjroihkaxsuvwkrhm.supabase.co/auth/v1/user', {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token,
                        'apikey': 'sb_publishable_YPLX3obafUHP8DPjKT9mug_f37TYfil'
                    },
                    body: JSON.stringify({ password: password })
                });

                if (response.ok) {
                    message.className = 'message success';
                    message.textContent = 'Password aggiornata con successo!';
                    btn.textContent = 'PASSWORD AGGIORNATA ✓';
                    setTimeout(function() {
                        window.location.href = '/login';
                    }, 2000);
                } else {
                    message.className = 'message error';
                    message.textContent = 'Errore. Link scaduto. Richiedi un nuovo reset.';
                    btn.disabled = false;
                    btn.textContent = 'AGGIORNA PASSWORD';
                }
            } catch (e) {
                message.className = 'message error';
                message.textContent = 'Errore di connessione. Riprova.';
                btn.disabled = false;
                btn.textContent = 'AGGIORNA PASSWORD';
            }
        }
    </script>
</body>
</html>
